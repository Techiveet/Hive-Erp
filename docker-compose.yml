services:
  # 1. CACHE (Redis)
  redis:
    image: redis:alpine
    container_name: hive-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # 2. DATABASE (Postgres 17)
  db:
    image: postgres:17-alpine
    container_name: hive-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: password
    volumes:
      - hive-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # 3. SEARCH (Meilisearch)
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: hive-search
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey
      - MEILI_NO_ANALYTICS=true
    volumes:
      - hive-search-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # 4. EMAIL CATCHER (Mailpit)
  mailpit:
    image: axllent/mailpit
    container_name: hive-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web Dashboard Port
    networks:
      - hive-network

  # 🚀 5. AI BACKGROUND REMOVAL (rembg)
  rembg:
    image: danielgatis/rembg:latest
    container_name: hive-ai-rembg
    restart: unless-stopped
    # Add the host and port flags to force it to listen externally
    command: s --host 0.0.0.0 --port 5000 
    ports:
      - "5000:5000"
    networks:
      - hive-network

  # 6. THE BRAIN (Laravel 12 + Octane)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hive-backend
    restart: unless-stopped
    ports:
      - "8085:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:c29tZXJhbmRvbXN0cmluZ2ZvcmRldmVsb3BtZW50MjE=
      APP_URL: http://localhost:8085
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hive
      DB_USERNAME: hive
      DB_PASSWORD: password
      OCTANE_SERVER: roadrunner
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: masterKey
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      WATCHPACK_POLLING: "true"
      # 🚀 TELL LARAVEL WHERE REVERB LIVES IN DOCKER
      REVERB_HOST: reverb
      PUSHER_HOST: reverb
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rembg:
        condition: service_started
    command: php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000
    networks:
      hive-network:
        aliases:
          - apple.localhost
          - tesla.localhost
          - spacex.localhost

  # 7. THE WORKER (Background Jobs)
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hive-queue
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: base64:c29tZXJhbmRvbXN0cmluZ2ZvcmRldmVsb3BtZW50MjE=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: hive
      DB_USERNAME: hive
      DB_PASSWORD: password
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # 🚀 TELL THE WORKER WHERE REVERB LIVES (For queued broadcasts)
      REVERB_HOST: reverb
      PUSHER_HOST: reverb
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      rembg:
        condition: service_started
    command: php artisan horizon
    networks:
      - hive-network

  # 8. THE FACE (Next.js 16)
 # 8. THE FACE (Next.js 16)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hive-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8085/api
      INTERNAL_API_URL: http://backend:8000/api
      WATCHPACK_POLLING: "true"
      # 🚀 ADD THESE TWO LINES: Forces Next.js to broadcast outside the container
      HOSTNAME: "0.0.0.0"
      PORT: 3000
    depends_on:
      - backend
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    networks:
      - hive-network

  # 9. DATABASE GUI (Adminer)
  adminer:
    image: adminer
    container_name: hive-adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hive-network

  # 🚀 10. WEBSOCKET ENGINE (Reverb) - NEW!
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hive-reverb
    restart: unless-stopped
    ports:
      - "9000:9000" # Expose Reverb to your local browser
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: base64:c29tZXJhbmRvbXN0cmluZ2ZvcmRldmVsb3BtZW50MjE=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: hive
      DB_USERNAME: hive
      DB_PASSWORD: password
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: php artisan reverb:start --host=0.0.0.0 --port=9000
    networks:
      - hive-network

networks:
  hive-network:
    driver: bridge

volumes:
  hive-db-data:
  hive-search-data: