services:
  # Reverse Proxy
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: hive-caddy
    container_name: hive-caddy
    restart: unless-stopped
    dns:
      - ${DOCKER_DNS_1:-1.1.1.1}
      - ${DOCKER_DNS_2:-8.8.8.8}
    env_file:
      - .env
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-techiveet.com}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-hive.techiveet.com}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-hive-backend.techiveet.com}
      REVERB_DOMAIN: ${REVERB_DOMAIN:-hive-ws.techiveet.com}
      HORIZON_DOMAIN: ${HORIZON_DOMAIN:-hive-queue.techiveet.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./storage/caddy_runtime/Caddyfile:/etc/caddy/Caddyfile
      - ./storage/caddy_data:/data
      - ./storage/caddy_config:/config
    networks:
      - hive-network
    depends_on:
      - frontend
      - backend
      - reverb

  # CACHE (Redis)
  redis:
    image: redis:alpine
    container_name: hive-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # DATABASE (Postgres 17)
  db:
    image: postgres:17-alpine
    container_name: hive-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hive}
      POSTGRES_USER: ${DB_USERNAME:-hive}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ./storage/db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # SEARCH (Meilisearch)
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: hive-search
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./storage/search-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # AI BACKGROUND REMOVAL (rembg)
  rembg:
    image: danielgatis/rembg:latest
    container_name: hive-ai-rembg
    restart: unless-stopped
    command: s --host 0.0.0.0 --port 5000 
    networks:
      - hive-network

  # PDF & DOC CONVERTER (Gotenberg)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: hive-gotenberg
    restart: unless-stopped
    networks:
      - hive-network

  # THE BRAIN (Laravel 12 + Octane)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: hive-backend
    restart: unless-stopped
    volumes:
      - ./storage/app:/var/www/html/storage/app
    env_file:
      - .env
    environment:
      APP_ENV: production
      OCTANE_SERVER: roadrunner
      SERVER_IP: ${SERVER_IP:-}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-techiveet.com}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-hive.techiveet.com}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-hive-backend.techiveet.com}
      REVERB_DOMAIN: ${REVERB_DOMAIN:-hive-ws.techiveet.com}
      HORIZON_DOMAIN: ${HORIZON_DOMAIN:-hive-queue.techiveet.com}
      MEILISEARCH_DOMAIN: ${MEILISEARCH_DOMAIN:-hive-search.techiveet.com}
      REMBG_DOMAIN: ${REMBG_DOMAIN:-hive-rembg.techiveet.com}
      GOTENBERG_DOMAIN: ${GOTENBERG_DOMAIN:-hive-docs.techiveet.com}
      REDIS_DOMAIN: ${REDIS_DOMAIN:-hive-redis.techiveet.com}
      DB_DOMAIN: ${DB_DOMAIN:-hive-db.techiveet.com}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      FRONTEND_INTERNAL_URL: ${FRONTEND_INTERNAL_URL:-http://frontend:3000}
      REVERB_INTERNAL_URL: ${REVERB_INTERNAL_URL:-http://reverb:9000}
      QUEUE_INTERNAL_HOST: ${QUEUE_INTERNAL_HOST:-queue}
      DB_HOST: ${DB_INTERNAL_HOST:-db}
      DB_INTERNAL_HOST: ${DB_INTERNAL_HOST:-db}
      REDIS_HOST: ${REDIS_INTERNAL_HOST:-redis}
      REDIS_INTERNAL_HOST: ${REDIS_INTERNAL_HOST:-redis}
      MEILISEARCH_HOST: ${MEILISEARCH_INTERNAL_URL:-http://meilisearch:7700}
      MEILISEARCH_INTERNAL_URL: ${MEILISEARCH_INTERNAL_URL:-http://meilisearch:7700}
      REMBG_INTERNAL_URL: ${REMBG_INTERNAL_URL:-http://rembg:5000}
      GOTENBERG_INTERNAL_URL: ${GOTENBERG_INTERNAL_URL:-http://gotenberg:3000}
      REVERB_HOST: reverb
      PUSHER_HOST: reverb
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - hive-network

  # THE WORKER (Background Jobs)
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: hive-queue
    restart: unless-stopped
    volumes:
      - ./storage/app:/var/www/html/storage/app
    env_file:
      - .env
    environment:
      APP_ENV: production
      ROOT_DOMAIN: ${ROOT_DOMAIN:-techiveet.com}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-hive.techiveet.com}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-hive-backend.techiveet.com}
      REVERB_DOMAIN: ${REVERB_DOMAIN:-hive-ws.techiveet.com}
      HORIZON_DOMAIN: ${HORIZON_DOMAIN:-hive-queue.techiveet.com}
      DB_HOST: ${DB_INTERNAL_HOST:-db}
      DB_INTERNAL_HOST: ${DB_INTERNAL_HOST:-db}
      REDIS_HOST: ${REDIS_INTERNAL_HOST:-redis}
      REDIS_INTERNAL_HOST: ${REDIS_INTERNAL_HOST:-redis}
      MEILISEARCH_HOST: ${MEILISEARCH_INTERNAL_URL:-http://meilisearch:7700}
      MEILISEARCH_INTERNAL_URL: ${MEILISEARCH_INTERNAL_URL:-http://meilisearch:7700}
      REVERB_HOST: reverb
      PUSHER_HOST: reverb
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: php artisan horizon
    networks:
      - hive-network

  # WEBSOCKET ENGINE (Reverb)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: hive-reverb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      ROOT_DOMAIN: ${ROOT_DOMAIN:-techiveet.com}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-hive-backend.techiveet.com}
      REVERB_DOMAIN: ${REVERB_DOMAIN:-hive-ws.techiveet.com}
      DB_HOST: ${DB_INTERNAL_HOST:-db}
      REDIS_HOST: ${REDIS_INTERNAL_HOST:-redis}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 9000
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: php artisan reverb:start --host=0.0.0.0 --port=9000
    networks:
      - hive-network

  # THE FACE (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_CENTRAL_DOMAINS: ${NEXT_PUBLIC_CENTRAL_DOMAINS:-}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-techiveet.com}
        NEXT_PUBLIC_FRONTEND_DOMAIN: ${NEXT_PUBLIC_FRONTEND_DOMAIN:-hive.techiveet.com}
        NEXT_PUBLIC_BACKEND_DOMAIN: ${NEXT_PUBLIC_BACKEND_DOMAIN:-hive-backend.techiveet.com}
        NEXT_PUBLIC_REVERB_DOMAIN: ${NEXT_PUBLIC_REVERB_DOMAIN:-hive-ws.techiveet.com}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000/api/v1}
    container_name: hive-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_IP: ${SERVER_IP:-}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-techiveet.com}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-hive.techiveet.com}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-hive-backend.techiveet.com}
      REVERB_DOMAIN: ${REVERB_DOMAIN:-hive-ws.techiveet.com}
      HORIZON_DOMAIN: ${HORIZON_DOMAIN:-hive-queue.techiveet.com}
      MEILISEARCH_DOMAIN: ${MEILISEARCH_DOMAIN:-hive-search.techiveet.com}
      REMBG_DOMAIN: ${REMBG_DOMAIN:-hive-rembg.techiveet.com}
      GOTENBERG_DOMAIN: ${GOTENBERG_DOMAIN:-hive-docs.techiveet.com}
      REDIS_DOMAIN: ${REDIS_DOMAIN:-hive-redis.techiveet.com}
      DB_DOMAIN: ${DB_DOMAIN:-hive-db.techiveet.com}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_CENTRAL_DOMAINS: ${NEXT_PUBLIC_CENTRAL_DOMAINS:-}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-techiveet.com}
      NEXT_PUBLIC_FRONTEND_DOMAIN: ${NEXT_PUBLIC_FRONTEND_DOMAIN:-hive.techiveet.com}
      NEXT_PUBLIC_BACKEND_DOMAIN: ${NEXT_PUBLIC_BACKEND_DOMAIN:-hive-backend.techiveet.com}
      NEXT_PUBLIC_REVERB_DOMAIN: ${NEXT_PUBLIC_REVERB_DOMAIN:-hive-ws.techiveet.com}
      NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
      NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
      NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT}
      NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      FRONTEND_INTERNAL_URL: ${FRONTEND_INTERNAL_URL:-http://frontend:3000}
      REVERB_INTERNAL_URL: ${REVERB_INTERNAL_URL:-http://reverb:9000}
      QUEUE_INTERNAL_HOST: ${QUEUE_INTERNAL_HOST:-queue}
      DB_INTERNAL_HOST: ${DB_INTERNAL_HOST:-db}
      REDIS_INTERNAL_HOST: ${REDIS_INTERNAL_HOST:-redis}
      MEILISEARCH_INTERNAL_URL: ${MEILISEARCH_INTERNAL_URL:-http://meilisearch:7700}
      REMBG_INTERNAL_URL: ${REMBG_INTERNAL_URL:-http://rembg:5000}
      GOTENBERG_INTERNAL_URL: ${GOTENBERG_INTERNAL_URL:-http://gotenberg:3000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - hive-network

networks:
  hive-network:
    driver: bridge
